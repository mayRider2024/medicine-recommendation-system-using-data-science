version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    command: python -m uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    networks:
      - medicine-network

  # Frontend (optional - typically run with npm run dev)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - medicine-network
    depends_on:
      - backend

networks:
  medicine-network:
    driver: bridge
